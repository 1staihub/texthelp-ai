name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "✓ Verifying build artifacts..."
          ls -la dist/
          [ -f dist/index.js ] && echo "✓ index.js found" || exit 1
          [ -f dist/index.d.ts ] && echo "✓ index.d.ts found" || exit 1
          echo "✓ Build verification passed"

      - name: Generate version and changelog
        id: release
        run: |
          npx standard-version --silent
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Generated version: $CURRENT_VERSION"

      - name: Rebuild after version change
        run: npm run build

      - name: Push changes to GitHub
        run: |
          git push --follow-tags origin main

      - name: Clean before publish
        run: npm ci --prefer-offline --no-audit

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publish
        continue-on-error: true
        run: |
          echo "⏳ Waiting for npm registry to update..."
          sleep 15
          npm view texthelp-ai@${{ steps.release.outputs.current_version }}
          echo "✅ Successfully published texthelp-ai@${{ steps.release.outputs.current_version }}"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.release.outputs.current_version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish success notification
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "✅ PUBLISH SUCCESSFUL"
          echo "=========================================="
          echo "Package: texthelp-ai"
          echo "Version: ${{ steps.release.outputs.current_version }}"
          echo "npm: https://www.npmjs.com/package/texthelp-ai"
          echo "GitHub: https://github.com/1staihub/texthelp-ai/releases/tag/v${{ steps.release.outputs.current_version }}"
          echo "=========================================="
