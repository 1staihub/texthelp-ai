name: Test and Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          [ -d dist ] && echo "✓ dist directory exists"
          [ -f dist/index.js ] && echo "✓ index.js exists"
          [ -f dist/index.d.ts ] && echo "✓ index.d.ts exists"
          ls -la dist/ | head -20
